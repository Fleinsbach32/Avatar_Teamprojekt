<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIRA — KIT Studienberatung</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --kit-green:      #009682;
      --kit-green-dark: #007a6a;
      --kit-green-dim:  #00968215;
      --kit-blue:       #003865;
      --border:         #1e3a52;
      --surface:        #012a45;
      --surface2:       #01213a;
      --bg:             #001529;
      --text:           #e8f4f8;
      --muted:          #7a9ab0;
      --user-bg:        #003865;
      --bot-bg:         #012a45;
      --radius:         14px;
      --font:           'DM Sans', sans-serif;
      --mono:           'DM Mono', monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .shell {
      width: 100%;
      max-width: 680px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      background: var(--bg);
    }

    /* HEADER */
    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--kit-blue);
      flex-shrink: 0;
    }

    .kit-badge {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: var(--kit-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      color: white;
      flex-shrink: 0;
    }

    header h1 { font-size: 15px; font-weight: 600; }
    header p  { font-size: 11px; color: rgba(255,255,255,0.6); font-weight: 300; }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.08);
      padding: 5px 12px;
      border-radius: 20px;
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
    }

    .status-dot.offline { background: #ef4444; animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* AVATAR SECTION */
    .avatar-section {
      background: var(--kit-blue);
      padding: 0 16px 16px;
      flex-shrink: 0;
    }

    .avatar-container {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(160deg, #001829 0%, #002a45 60%, #003865 100%);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(0,150,130,0.2);
    }

    /* Placeholder */
    .avatar-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      position: absolute;
      top: 0; left: 0;
    }

    .avatar-ring {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(0,150,130,0.1);
      border: 1.5px solid rgba(0,150,130,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      position: relative;
    }

    .avatar-ring::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px solid rgba(0,150,130,0.15);
      animation: ripple 2.5s ease-out infinite;
    }

    @keyframes ripple {
      0%   { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    .avatar-label {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
    }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(0,150,130,0.3);
      border-top-color: var(--kit-green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .start-btn {
      background: var(--kit-green);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 8px 20px;
      font-size: 13px;
      font-family: var(--font);
      cursor: pointer;
      transition: background 0.2s;
    }

    .start-btn:hover { background: var(--kit-green-dark); }
    .start-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* LiveAvatar iframe */
    #avatarVideo {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 12px;
      object-fit: cover;
      display: none;
    }

    /* CHIPS */
    .chips-row {
      padding: 10px 16px 0;
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      flex-shrink: 0;
      background: var(--bg);
    }

    .chip {
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .chip:hover {
      border-color: var(--kit-green);
      color: var(--text);
      background: var(--kit-green-dim);
    }

    /* MESSAGES */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--muted);
      text-align: center;
      padding: 20px;
    }

    .empty-state .icon { font-size: 36px; opacity: 0.3; }
    .empty-state p { font-size: 13px; font-weight: 300; line-height: 1.6; max-width: 260px; }

    .msg {
      display: flex;
      gap: 8px;
      animation: fadeUp 0.25s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { flex-direction: row-reverse; }

    .msg-icon {
      width: 28px; height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      margin-top: 2px;
    }

    .msg.bot  .msg-icon { background: var(--kit-green-dim); border: 1px solid rgba(0,150,130,0.4); }
    .msg.user .msg-icon { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); }

    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.65;
      font-weight: 300;
    }

    .msg.bot  .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg.user .bubble {
      background: var(--user-bg);
      border: 1px solid rgba(0,150,130,0.25);
      border-bottom-right-radius: 4px;
      color: #d4eaf5;
    }

    .role-label {
      font-size: 10px;
      font-weight: 500;
      font-family: var(--mono);
      margin-bottom: 4px;
      opacity: 0.5;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .meta {
      font-size: 10px;
      font-family: var(--mono);
      color: var(--muted);
      margin-top: 5px;
      display: flex;
      gap: 8px;
    }

    .meta .wb  { color: var(--kit-green); }
    .meta .llm { color: #f59e0b; }

    .typing-dots { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
    .typing-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--kit-green);
      animation: dot-bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot-bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1);   opacity: 1; }
    }

    .error-bubble {
      background: #2a1515;
      border: 1px solid #5a2020;
      color: #ff8080;
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 13px;
      font-family: var(--mono);
    }

    /* INPUT */
    .input-area {
      padding: 12px 16px 16px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }

    .input-row { display: flex; gap: 8px; align-items: flex-end; }

    .tts-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--muted);
      transition: all 0.2s;
    }

    .tts-btn.active {
      background: var(--kit-green-dim);
      border-color: var(--kit-green);
      color: var(--kit-green);
    }

    .tts-btn svg { width: 16px; height: 16px; }

    #userInput {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 14px;
      font-size: 14px;
      font-family: var(--font);
      color: var(--text);
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 120px;
      line-height: 1.5;
      transition: border-color 0.2s;
    }

    #userInput:focus { border-color: var(--kit-green); }
    #userInput::placeholder { color: var(--muted); }

    #sendBtn {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--kit-green);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }

    #sendBtn:hover    { background: var(--kit-green-dark); }
    #sendBtn:active   { transform: scale(0.95); }
    #sendBtn:disabled { opacity: 0.3; cursor: not-allowed; }
    #sendBtn svg { width: 18px; height: 18px; fill: white; }

    .hint { margin-top: 6px; font-size: 11px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
<div class="shell">

  <!-- Header -->
  <header>
    <div class="kit-badge">KIT</div>
    <div>
      <h1>KIRA</h1>
      <p>KIT Intelligente Ratsgeberin · Studienberatung</p>
    </div>
    <div class="status">
      <div class="status-dot offline" id="statusDot"></div>
      <span id="statusText">verbinde...</span>
    </div>
  </header>

  <!-- Avatar -->
  <div class="avatar-section">
    <div class="avatar-container">
      <div class="avatar-placeholder" id="avatarPlaceholder">
        <div class="avatar-ring">🎓</div>
        <span class="avatar-label" id="avatarLabel">KIRA ist bereit</span>
        <button class="start-btn" id="startBtn" onclick="startAvatar()">
          Avatar starten
        </button>
      </div>
      <video
        id="avatarVideo"
        autoplay
        playsinline
        style="width:100%;height:100%;border:none;border-radius:12px;display:none;object-fit:cover;"
      ></video>
    </div>
  </div>

  <!-- Quick Chips -->
  <div class="chips-row">
    <div class="chip" onclick="quickSend('Wann ist die Bewerbungsfrist?')">Bewerbungsfristen</div>
    <div class="chip" onclick="quickSend('Wie melde ich mich für Prüfungen an?')">Prüfungsanmeldung</div>
    <div class="chip" onclick="quickSend('Wie beantrage ich BAföG?')">BAföG</div>
    <div class="chip" onclick="quickSend('Was ist das Semesterticket?')">Semesterticket</div>
    <div class="chip" onclick="quickSend('Gibt es psychologische Beratung?')">Beratung</div>
  </div>

  <!-- Messages -->
  <div id="messages">
    <div class="empty-state" id="emptyState">
      <div class="icon">💬</div>
      <p>Willkommen bei KIRA.<br><br>
        Ich beantworte Ihre Fragen rund um das Studium am KIT.
      </p>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-row">
      <button class="tts-btn active" id="ttsBtn" title="Text-to-Speech">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      </button>
      <textarea id="userInput" placeholder="Ihre Frage an KIRA..." rows="1"></textarea>
      <button id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <p class="hint">Enter zum Senden · Shift+Enter für neue Zeile</p>
  </div>

</div>

<script>
  const API_URL   = "/chat";
  const sessionId = "session_" + Math.random().toString(36).substr(2, 9);
  let ttsEnabled  = true;

  const ttsBtn      = document.getElementById("ttsBtn");
  const avatarVideo  = document.getElementById("avatarVideo");
  let streamingSessionId = null;
  let peerConnection = null;
  const avatarPH    = document.getElementById("avatarPlaceholder");
  const avatarLabel = document.getElementById("avatarLabel");
  const startBtn    = document.getElementById("startBtn");

  ttsBtn.addEventListener("click", () => {
    ttsEnabled = !ttsEnabled;
    ttsBtn.classList.toggle("active", ttsEnabled);
    if (!ttsEnabled) window.speechSynthesis.cancel();
  });

  // Health Check
  fetch("/health")
    .then(r => r.json())
    .then(() => {
      document.getElementById("statusDot").classList.remove("offline");
      document.getElementById("statusText").textContent = "bereit";
    })
    .catch(() => {
      document.getElementById("statusDot").classList.add("offline");
      document.getElementById("statusText").textContent = "server nicht erreichbar";
    });

  // ── LiveAvatar Embed starten ──────────────────────────
  async function startAvatar() {
    startBtn.disabled = true;
    avatarLabel.innerHTML = '<div style="display:flex;align-items:center;gap:8px;color:#009682"><div class="spinner"></div> Verbinde mit KIRA...</div>';

    try {
      // Backend holt Embed URL — API Key bleibt sicher!
      const res = await fetch("/liveavatar-embed", { method: "POST" });
      const data = await res.json();

      if (!data.url) throw new Error("Keine Embed URL erhalten");

      // iframe einblenden
      avatarIframe.src = data.url;
      avatarIframe.style.display = "block";
      avatarPH.style.display = "none";

      document.getElementById("statusText").textContent = "Avatar aktiv";

    } catch (err) {
      console.error("Avatar Fehler:", err);
      avatarLabel.textContent = "Avatar nicht verfügbar";
      startBtn.disabled = false;
      startBtn.textContent = "Erneut versuchen";
    }
  }

  // TTS Fallback
 async function speak(text) {
  if (!ttsEnabled) return;
  try {
    const res = await fetch("/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    const audio = new Audio(data.audio_url);
    audio.play();
  } catch {
    // Fallback Browser TTS
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = "de-DE";
    window.speechSynthesis.speak(utt);
  }
}

  // ── Chat ─────────────────────────────────────────────
  function quickSend(text) {
    document.getElementById("userInput").value = text;
    sendMessage();
  }

  document.getElementById("userInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  document.getElementById("userInput").addEventListener("input", function () {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 120) + "px";
  });

  async function sendMessage() {
    const input = document.getElementById("userInput");
    const text  = input.value.trim();
    if (!text) return;

    input.value = "";
    input.style.height = "auto";

    const emptyState = document.getElementById("emptyState");
    if (emptyState) emptyState.remove();

    addMessage("user", text);
    document.getElementById("sendBtn").disabled = true;
    document.getElementById("statusText").textContent = "denkt nach...";

    const typingId = showTyping();

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: sessionId })
      });

      removeTyping(typingId);

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || `HTTP ${res.status}`);
      }

      const data = await res.json();
      addMessage("bot", data.answer, { source: data.source, latency_ms: data.latency_ms });

      // TTS Fallback (Avatar hat eigene Stimme im iframe)
      speak(data.answer);

    } catch (err) {
      removeTyping(typingId);
      showError(err.message);
    } finally {
      document.getElementById("sendBtn").disabled = false;
      document.getElementById("statusText").textContent = "bereit";
    }
  }

  function addMessage(role, text, meta = null) {
    const messages = document.getElementById("messages");
    const msg = document.createElement("div");
    msg.className = `msg ${role}`;

    const icon = document.createElement("div");
    icon.className = "msg-icon";
    icon.textContent = role === "bot" ? "🎓" : "👤";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const label = document.createElement("div");
    label.className = "role-label";
    label.textContent = role === "bot" ? "KIRA" : "Sie";

    const content = document.createElement("div");
    content.textContent = text;

    bubble.appendChild(label);
    bubble.appendChild(content);

    if (meta) {
      const m = document.createElement("div");
      m.className = "meta";
      const cls  = meta.source === "Wissensbasis" ? "wb" : "llm";
      const ico  = meta.source === "Wissensbasis" ? "📚" : "🧠";
      m.innerHTML = `<span class="${cls}">${ico} ${meta.source}</span><span>${meta.latency_ms}ms</span>`;
      bubble.appendChild(m);
    }

    msg.appendChild(icon);
    msg.appendChild(bubble);
    messages.appendChild(msg);
    messages.scrollTop = messages.scrollHeight;
  }

  function showTyping() {
    const messages = document.getElementById("messages");
    const id = "typing-" + Date.now();
    const msg = document.createElement("div");
    msg.className = "msg bot";
    msg.id = id;
    const icon = document.createElement("div");
    icon.className = "msg-icon";
    icon.textContent = "🎓";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    const dots = document.createElement("div");
    dots.className = "typing-dots";
    dots.innerHTML = "<span></span><span></span><span></span>";
    bubble.appendChild(dots);
    msg.appendChild(icon);
    msg.appendChild(bubble);
    messages.appendChild(msg);
    messages.scrollTop = messages.scrollHeight;
    return id;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function showError(message) {
    const messages = document.getElementById("messages");
    const err = document.createElement("div");
    err.className = "error-bubble";
    err.textContent = "⚠ Fehler: " + message;
    messages.appendChild(err);
    messages.scrollTop = messages.scrollHeight;
  }
</script>
</body>
</html>
