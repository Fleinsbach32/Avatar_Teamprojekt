<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Chatbot</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f0f0f;
      --surface:   #1a1a1a;
      --surface2:  #242424;
      --border:    #2e2e2e;
      --accent:    #00e554;
      --accent-dim:#00e5a022;
      --text:      #f0f0f0;
      --muted:     #666;
      --user-bg:   #1e2a24;
      --bot-bg:    #1a1a1a;
      --radius:    14px;
      --font:      'DM Sans', sans-serif;
      --mono:      'DM Mono', monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .shell {
      width: 100%;
      max-width: 720px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    /* ── Header ── */
    header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
    }

    .avatar-dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 1.5px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    header h1 { font-size: 15px; font-weight: 500; letter-spacing: 0.01em; }
    header p  { font-size: 12px; color: var(--muted); font-weight: 300; }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── API Key Banner ── */
    .api-banner {
      margin: 16px 24px 0;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .api-banner label {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      font-family: var(--mono);
    }

    .api-banner input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      font-family: var(--mono);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    .api-banner input:focus { border-color: var(--accent); }

    .save-btn {
      padding: 7px 14px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--font);
      transition: opacity 0.2s;
    }

    .save-btn:hover { opacity: 0.85; }

    /* ── System Prompt ── */
    .system-row {
      margin: 10px 24px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .system-row label {
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
      white-space: nowrap;
    }

    .system-row input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      color: var(--text);
      font-family: var(--font);
      outline: none;
      transition: border-color 0.2s;
    }

    .system-row input:focus { border-color: var(--accent); }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg {
      display: flex;
      gap: 10px;
      animation: fadeUp 0.25s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { flex-direction: row-reverse; }

    .msg-icon {
      width: 30px; height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      margin-top: 2px;
    }

    .msg.bot  .msg-icon { background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent); }
    .msg.user .msg-icon { background: var(--surface2);   border: 1px solid var(--border); color: var(--muted); }

    .bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.65;
      font-weight: 300;
    }

    .msg.bot  .bubble { background: var(--bot-bg);  border: 1px solid var(--border);   border-bottom-left-radius: 4px; }
    .msg.user .bubble { background: var(--user-bg); border: 1px solid #00e5a033; border-bottom-right-radius: 4px; color: #d4f5e9; }

    .bubble .role-label {
      font-size: 10px;
      font-weight: 500;
      font-family: var(--mono);
      margin-bottom: 5px;
      opacity: 0.5;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Typing indicator */
    .typing-dots { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
    .typing-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: dot-bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot-bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1);   opacity: 1; }
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      text-align: center;
    }

    .empty-state .big-icon { font-size: 40px; opacity: 0.3; }
    .empty-state p { font-size: 13px; font-weight: 300; line-height: 1.6; max-width: 280px; }

    /* ── Input Area ── */
    .input-area {
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }

    .input-row { display: flex; gap: 10px; align-items: flex-end; }

    #userInput {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 14px;
      font-family: var(--font);
      color: var(--text);
      resize: none;
      outline: none;
      min-height: 46px;
      max-height: 140px;
      line-height: 1.5;
      transition: border-color 0.2s;
    }

    #userInput:focus { border-color: var(--accent); }
    #userInput::placeholder { color: var(--muted); }

    #sendBtn {
      width: 46px; height: 46px;
      border-radius: 12px;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.1s;
    }

    #sendBtn:hover    { opacity: 0.85; }
    #sendBtn:active   { transform: scale(0.95); }
    #sendBtn:disabled { opacity: 0.3; cursor: not-allowed; }
    #sendBtn svg { width: 18px; height: 18px; fill: #000; }

    .hint { margin-top: 8px; font-size: 11px; color: var(--muted); text-align: center; }

    .error-bubble {
      background: #2a1515;
      border: 1px solid #5a2020;
      color: #ff8080;
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 13px;
      font-family: var(--mono);
    }
  </style>
</head>
<body>
<div class="shell">

  <header>
    <div class="avatar-dot">🤖</div>
    <div>
      <h1>Avatar Chatbot</h1>
      <p>Gemini 2.0 Flash · Giving AI a Face</p>
    </div>
    <div class="status">
      <div class="status-dot"></div>
      <span id="statusText">bereit</span>
    </div>
  </header>

  <!-- API Key -->
  <div class="api-banner">
    <label>API KEY</label>
    <input type="password" id="apiKeyInput" placeholder="AIza..." />
    <button class="save-btn" onclick="saveKey()">Speichern</button>
  </div>

  <!-- System Prompt -->
  <div class="system-row">
    <label>SYSTEM</label>
    <input type="text" id="systemPrompt" value="Du bist ein hilfreicher KI-Assistent. Antworte auf Deutsch, klar und freundlich." />
  </div>

  <!-- Messages -->
  <div id="messages">
    <div class="empty-state" id="emptyState">
      <div class="big-icon">💬</div>
      <p>Gib deinen Gemini API-Key ein und starte das Gespräch.<br><br>
         Key bekommst du kostenlos auf:<br>
         <strong style="color: var(--accent);">aistudio.google.com</strong>
      </p>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-row">
      <textarea id="userInput" placeholder="Schreib eine Nachricht..." rows="1"></textarea>
      <button id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
    <p class="hint">Enter zum Senden · Shift+Enter für neue Zeile</p>
  </div>

</div>

<script>
  // ── State ──────────────────────────────────────────────────────────
  let apiKey = localStorage.getItem('gemini_key') || '';
  let conversationHistory = []; // { role: 'user'|'model', parts: [{text}] }

  if (apiKey) document.getElementById('apiKeyInput').value = apiKey;

  // ── API Key speichern ──────────────────────────────────────────────
  function saveKey() {
    apiKey = document.getElementById('apiKeyInput').value.trim();
    localStorage.setItem('gemini_key', apiKey);
    document.getElementById('statusText').textContent = 'API Key gespeichert ✓';
    setTimeout(() => document.getElementById('statusText').textContent = 'bereit', 2000);
  }

  // ── Enter-Taste ────────────────────────────────────────────────────
  document.getElementById('userInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Textarea auto-resize
  document.getElementById('userInput').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 140) + 'px';
  });

  // ── Nachricht senden ───────────────────────────────────────────────
  async function sendMessage() {
    const input     = document.getElementById('userInput');
    const text      = input.value.trim();

    if (!text) return;
    if (!apiKey) {
      alert('Bitte zuerst den Gemini API-Key eingeben und speichern!');
      return;
    }

    input.value = '';
    input.style.height = 'auto';

    // Empty state entfernen
    const emptyState = document.getElementById('emptyState');
    if (emptyState) emptyState.remove();

    // Nutzernachricht anzeigen
    addMessage('user', text);

    // Zur History hinzufügen
    // Gemini nutzt 'user' und 'model' (nicht 'assistant'!)
    conversationHistory.push({ role: 'user', parts: [{ text }] });

    document.getElementById('sendBtn').disabled = true;
    document.getElementById('statusText').textContent = 'denkt nach...';

    const typingId = showTyping();

    try {
      const systemPrompt = document.getElementById('systemPrompt').value;

      // ── Gemini API Aufbau ──────────────────────────────
      // Endpoint: generativelanguage.googleapis.com
      // Modell:   gemini-2.5-flash  (günstig & schnell, hat Free-Tier)
      // Format:   { system_instruction, contents: [{role, parts}] }
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({

            // System Prompt (bei Gemini separat, nicht in contents)
            system_instruction: {
              parts: [{ text: systemPrompt }]
            },

            // Gesamte Konversationshistorie
            contents: conversationHistory,

            // Optionale Einstellungen
            generationConfig: {
              temperature:     0.7,
              maxOutputTokens: 1000,
            }
          })
        }
      );

      removeTyping(typingId);

      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.error?.message || `HTTP ${response.status}`);
      }

      const data      = await response.json();
      const botReply  = data.candidates[0].content.parts[0].text;

      // Antwort zur History hinzufügen (Gemini nutzt 'model' statt 'assistant')
      conversationHistory.push({ role: 'model', parts: [{ text: botReply }] });

      addMessage('bot', botReply);

    } catch (err) {
      removeTyping(typingId);
      showError(err.message);
    } finally {
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('statusText').textContent = 'bereit';
    }
  }

  // ── Nachricht ins DOM ──────────────────────────────────────────────
  function addMessage(role, text) {
    const messages = document.getElementById('messages');

    const msg    = document.createElement('div');
    msg.className = `msg ${role}`;

    const icon    = document.createElement('div');
    icon.className = 'msg-icon';
    icon.textContent = role === 'bot' ? '🤖' : '👤';

    const bubble  = document.createElement('div');
    bubble.className = 'bubble';

    const label   = document.createElement('div');
    label.className = 'role-label';
    label.textContent = role === 'bot' ? 'Gemini 2.5 Flash' : 'Du';

    const content = document.createElement('div');
    content.textContent = text;

    bubble.appendChild(label);
    bubble.appendChild(content);
    msg.appendChild(icon);
    msg.appendChild(bubble);
    messages.appendChild(msg);
    messages.scrollTop = messages.scrollHeight;
  }

  // ── Typing Indikator ───────────────────────────────────────────────
  function showTyping() {
    const messages = document.getElementById('messages');
    const id = 'typing-' + Date.now();

    const msg = document.createElement('div');
    msg.className = 'msg bot';
    msg.id = id;

    const icon = document.createElement('div');
    icon.className = 'msg-icon';
    icon.textContent = '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const dots = document.createElement('div');
    dots.className = 'typing-dots';
    dots.innerHTML = '<span></span><span></span><span></span>';

    bubble.appendChild(dots);
    msg.appendChild(icon);
    msg.appendChild(bubble);
    messages.appendChild(msg);
    messages.scrollTop = messages.scrollHeight;
    return id;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  // ── Fehler anzeigen ────────────────────────────────────────────────
  function showError(message) {
    const messages = document.getElementById('messages');
    const err = document.createElement('div');
    err.className = 'error-bubble';
    err.textContent = '⚠ Fehler: ' + message;
    messages.appendChild(err);
    messages.scrollTop = messages.scrollHeight;
  }
</script>

</body>
</html>
