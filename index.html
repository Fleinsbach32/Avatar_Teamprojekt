<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIRA — KIT Studienberatung</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f0f0f;
      --surface:   #1a1a1a;
      --surface2:  #242424;
      --border:    #2e2e2e;
      --accent:    #00e554;
      --accent-dim:#00e5a022;
      --text:      #f0f0f0;
      --muted:     #666;
      --user-bg:   #1e2a24;
      --bot-bg:    #1a1a1a;
      --radius:    14px;
      --font:      'DM Sans', sans-serif;
      --mono:      'DM Mono', monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .shell {
      width: 100%;
      max-width: 720px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
    }

    .avatar-dot {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 1.5px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    header h1 { font-size: 15px; font-weight: 500; letter-spacing: 0.01em; }
    header p  { font-size: 12px; color: var(--muted); font-weight: 300; }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }

    .status-dot.offline { background: #ef4444; animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    .chips-row {
      padding: 12px 24px 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .chip:hover {
      border-color: var(--accent);
      color: var(--text);
      background: var(--accent-dim);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg {
      display: flex;
      gap: 10px;
      animation: fadeUp 0.25s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { flex-direction: row-reverse; }

    .msg-icon {
      width: 30px; height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      margin-top: 2px;
    }

    .msg.bot  .msg-icon { background: var(--accent-dim); border: 1px solid var(--accent); }
    .msg.user .msg-icon { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); }

    .bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.65;
      font-weight: 300;
    }

    .msg.bot  .bubble { background: var(--bot-bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.user .bubble { background: var(--user-bg); border: 1px solid #00e5a033; border-bottom-right-radius: 4px; color: #d4f5e9; }

    .bubble .role-label {
      font-size: 10px;
      font-weight: 500;
      font-family: var(--mono);
      margin-bottom: 5px;
      opacity: 0.5;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .meta {
      font-size: 10px;
      font-family: var(--mono);
      color: var(--muted);
      margin-top: 5px;
      display: flex;
      gap: 8px;
    }

    .meta .wb  { color: var(--accent); }
    .meta .llm { color: #f59e0b; }

    .typing-dots { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
    .typing-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: dot-bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot-bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1);   opacity: 1; }
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      text-align: center;
    }

    .empty-state .big-icon { font-size: 40px; opacity: 0.3; }
    .empty-state p { font-size: 13px; font-weight: 300; line-height: 1.6; max-width: 280px; }

    .input-area {
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }

    .input-row { display: flex; gap: 10px; align-items: flex-end; }

    #userInput {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 14px;
      font-family: var(--font);
      color: var(--text);
      resize: none;
      outline: none;
      min-height: 46px;
      max-height: 140px;
      line-height: 1.5;
      transition: border-color 0.2s;
    }

    #userInput:focus { border-color: var(--accent); }
    #userInput::placeholder { color: var(--muted); }

    #sendBtn {
      width: 46px; height: 46px;
      border-radius: 12px;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.1s;
    }

    #sendBtn:hover    { opacity: 0.85; }
    #sendBtn:active   { transform: scale(0.95); }
    #sendBtn:disabled { opacity: 0.3; cursor: not-allowed; }
    #sendBtn svg { width: 18px; height: 18px; fill: #000; }

    .hint { margin-top: 8px; font-size: 11px; color: var(--muted); text-align: center; }

    .error-bubble {
      background: #2a1515;
      border: 1px solid #5a2020;
      color: #ff8080;
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 13px;
      font-family: var(--mono);
    }
  </style>
</head>
<body>
<div class="shell">

  <header>
    <div class="avatar-dot">🎓</div>
    <div>
      <h1>KIRA</h1>
      <p>KIT Intelligente Ratsgeberin · Studienberatung</p>
    </div>
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">verbinde...</span>
    </div>
  </header>

  <div class="chips-row">
    <div class="chip" onclick="quickSend('Wann ist die Bewerbungsfrist?')">Bewerbungsfristen</div>
    <div class="chip" onclick="quickSend('Wie melde ich mich für Prüfungen an?')">Prüfungsanmeldung</div>
    <div class="chip" onclick="quickSend('Wie beantrage ich BAföG?')">BAföG</div>
    <div class="chip" onclick="quickSend('Was ist das Semesterticket?')">Semesterticket</div>
    <div class="chip" onclick="quickSend('Gibt es psychologische Beratung?')">Beratung</div>
  </div>

  <div id="messages">
    <div class="empty-state" id="emptyState">
      <div class="big-icon">💬</div>
      <p>Willkommen bei KIRA.<br><br>
        Ich beantworte Ihre Fragen rund um das Studium am KIT.
      </p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="userInput" placeholder="Ihre Frage an KIRA..." rows="1"></textarea>
      <button id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <p class="hint">Enter zum Senden · Shift+Enter für neue Zeile</p>
  </div>

</div>

<script>
  const API_URL  = "/chat";
  const sessionId = "session_" + Math.random().toString(36).substr(2, 9);

  // Health Check
  fetch("/health")
    .then(r => r.json())
    .then(d => {
      document.getElementById("statusDot").classList.remove("offline");
      document.getElementById("statusText").textContent = `bereit · ${d.eintraege} Einträge`;
    })
    .catch(() => {
      document.getElementById("statusDot").classList.add("offline");
      document.getElementById("statusText").textContent = "server nicht erreichbar";
    });

  function quickSend(text) {
    document.getElementById("userInput").value = text;
    sendMessage();
  }

  document.getElementById("userInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  document.getElementById("userInput").addEventListener("input", function () {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 140) + "px";
  });

  async function sendMessage() {
    const input = document.getElementById("userInput");
    const text  = input.value.trim();
    if (!text) return;

    input.value = "";
    input.style.height = "auto";

    const emptyState = document.getElementById("emptyState");
    if (emptyState) emptyState.remove();

    addMessage("user", text);
    document.getElementById("sendBtn").disabled = true;
    document.getElementById("statusText").textContent = "denkt nach...";

    const typingId = showTyping();

    try {
      // FastAPI /chat aufrufen
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: sessionId })
      });

      removeTyping(typingId);

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || `HTTP ${res.status}`);
      }

      const data = await res.json();
      addMessage("bot", data.answer, { source: data.source, latency_ms: data.latency_ms });

    } catch (err) {
      removeTyping(typingId);
      showError(err.message);
    } finally {
      document.getElementById("sendBtn").disabled = false;
      document.getElementById("statusText").textContent = "bereit";
    }
  }

  function addMessage(role, text, meta = null) {
    const messages = document.getElementById("messages");
    const msg = document.createElement("div");
    msg.className = `msg ${role}`;

    const icon = document.createElement("div");
    icon.className = "msg-icon";
    icon.textContent = role === "bot" ? "🎓" : "👤";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const label = document.createElement("div");
    label.className = "role-label";
    label.textContent = role === "bot" ? "KIRA" : "Sie";

    const content = document.createElement("div");
    content.textContent = text;

    bubble.appendChild(label);
    bubble.appendChild(content);

    if (meta) {
      const m = document.createElement("div");
      m.className = "meta";
      const cls  = meta.source === "Wissensbasis" ? "wb" : "llm";
      const icon = meta.source === "Wissensbasis" ? "📚" : "🧠";
      m.innerHTML = `<span class="${cls}">${icon} ${meta.source}</span><span>${meta.latency_ms}ms</span>`;
      bubble.appendChild(m);
    }

    msg.appendChild(icon);
    msg.appendChild(bubble);
    messages.appendChild(msg);
    messages.scrollTop = messages.scrollHeight;
  }

  function showTyping() {
    const messages = document.getElementById("messages");
    const id = "typing-" + Date.now();
    const msg = document.createElement("div");
    msg.className = "msg bot";
    msg.id = id;
    const icon = document.createElement("div");
    icon.className = "msg-icon";
    icon.textContent = "🎓";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    const dots = document.createElement("div");
    dots.className = "typing-dots";
    dots.innerHTML = "<span></span><span></span><span></span>";
    bubble.appendChild(dots);
    msg.appendChild(icon);
    msg.appendChild(bubble);
    messages.appendChild(msg);
    messages.scrollTop = messages.scrollHeight;
    return id;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function showError(message) {
    const messages = document.getElementById("messages");
    const err = document.createElement("div");
    err.className = "error-bubble";
    err.textContent = "⚠ Fehler: " + message;
    messages.appendChild(err);
    messages.scrollTop = messages.scrollHeight;
  }
</script>
</body>
</html>
